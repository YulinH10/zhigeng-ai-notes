<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">RSI：执行系统与改进机制的跨轮闭环</title>
  <desc id="desc">任务由执行系统产生轨迹，改进机制据此提出候选，独立验收后形成后继执行系统。改进经历也更新经验或改进者，再用于下一轮。评分、权限、审计和激活在候选写权限之外。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker>
    <style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#253b31}.title{font-family:'Songti SC',serif;font-size:35px;font-weight:600}.label{font-size:25px;font-weight:600}.body{font-size:21px}.muted{fill:#6d776e}.green{fill:#37694f}.blue{fill:#426584}.line{fill:none;stroke:#37694f;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="800" fill="#fafaf6"/>
  <text x="48" y="46" class="body green">FIG. 01 / RECURSIVE SELF-IMPROVEMENT</text>
  <text x="48" y="100" class="title">执行得更好，也要检验怎样改得更好</text>
  <text x="48" y="141" class="body muted">本文工程示意 · 执行 Harness 与改进机制分别版本化</text>
  <path d="M48 166H1072" stroke="#d4dbd0"/>
  <rect x="48" y="215" width="224" height="115" fill="#edf2e9" stroke="#37694f"/>
  <text x="160" y="258" class="label" text-anchor="middle">执行系统 A_t</text>
  <text x="160" y="296" class="body muted" text-anchor="middle">模型 + Harness</text>
  <path d="M281 272H321" class="line"/>
  <rect x="332" y="215" width="210" height="115" fill="#edf2e9" stroke="#37694f"/>
  <text x="437" y="258" class="label" text-anchor="middle">运行并取证</text>
  <text x="437" y="296" class="body muted" text-anchor="middle">轨迹 / 产物 / 反馈</text>
  <path d="M552 272H591" class="line"/>
  <rect x="602" y="215" width="220" height="115" fill="#edf2e9" stroke="#37694f"/>
  <text x="712" y="258" class="label" text-anchor="middle">提出候选</text>
  <text x="712" y="296" class="body muted" text-anchor="middle">使用改进机制 U_t</text>
  <path d="M832 272H871" class="line"/>
  <rect x="882" y="215" width="190" height="115" fill="#eef1f4" stroke="#426584"/>
  <text x="977" y="258" class="label blue" text-anchor="middle">独立验收</text>
  <text x="977" y="296" class="body muted" text-anchor="middle">收益 / 回归 / 成本</text>
  <path d="M977 341V407" class="line"/>
  <rect x="602" y="419" width="470" height="110" fill="#edf2e9" stroke="#37694f"/>
  <text x="626" y="460" class="label">后继执行系统 A_(t+1)</text>
  <text x="626" y="498" class="body muted">通过才保留；证据不足时沿用当前版本</text>
  <path d="M591 474H160V341" class="line"/>
  <text x="198" y="456" class="body green">下一轮实际加载已登记的版本</text>
  <rect x="48" y="562" width="1024" height="98" fill="#eef1f4" stroke="#426584"/>
  <text x="72" y="602" class="label blue">改进经历 → 经验或训练 → 改进机制 U_(t+1)</text>
  <text x="72" y="638" class="body muted">单独比较：相同起点与总预算下，更新 U 是否改善了后续搜索？</text>
  <path d="M712 341V394H562V551" fill="none" stroke="#426584" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1072 612H1092V189H712V204" fill="none" stroke="#426584" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="700" width="1024" height="53" fill="#253b31"/>
  <text x="72" y="734" font-size="21" style="fill:#fff">候选写权限之外：评分与测试数据 · 权限与预算 · 审计与停止 · 人工激活与回滚</text>
  <text x="48" y="782" font-size="15" class="muted">ZHIGENG / AI NOTES</text>
  <text x="1072" y="782" font-size="15" class="muted" text-anchor="end">RSI / 2026.11</text>
</svg>
