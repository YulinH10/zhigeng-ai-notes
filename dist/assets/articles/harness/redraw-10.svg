<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">先把混杂样本整理成可路由的数据</title><desc id="desc">同一个问题可能反复出现，同一个标签也可能混着不同原因。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
<rect x="0" y="0" width="1120" height="630" fill="#fafaf6" stroke="none" stroke-width="1.5" rx="0"/>
<text x="48" y="45" font-family="&#x27;SFMono-Regular&#x27;,&#x27;Menlo&#x27;,monospace" font-size="18" font-weight="400" fill="#37694f" text-anchor="start">FIG. 10</text>
<text x="48" y="98" font-family="&#x27;Songti SC&#x27;,&#x27;Noto Serif CJK SC&#x27;,serif" font-size="36" font-weight="600" fill="#253b31" text-anchor="start">先把混杂样本整理成可路由的数据</text>
<text x="48" y="139" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="21" font-weight="400" fill="#6d776e" text-anchor="start">同一个问题可能反复出现，同一个标签也可能混着不同原因。</text>
<path d="M48 163 L1072 163" fill="none" stroke="#d4dbd0" stroke-width="1.5"/>
<path d="M48 588 L1072 588" fill="none" stroke="#d4dbd0" stroke-width="1.5"/>
<text x="48" y="613" font-family="&#x27;SFMono-Regular&#x27;,&#x27;Menlo&#x27;,monospace" font-size="15" font-weight="400" fill="#6d776e" text-anchor="start">HARNESS / LOOP</text>
<text x="1072" y="613" font-family="&#x27;SFMono-Regular&#x27;,&#x27;Menlo&#x27;,monospace" font-size="15" font-weight="400" fill="#6d776e" text-anchor="end">10 / 20</text>
<text x="48" y="229" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="29" font-weight="600" fill="#253b31" text-anchor="start">拉取</text>
<path d="M203 219 L284 219" fill="none" stroke="#37694f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="312" y="229" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="29" font-weight="600" fill="#253b31" text-anchor="start">归一化</text>
<path d="M467 219 L548 219" fill="none" stroke="#37694f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="576" y="229" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="29" font-weight="600" fill="#253b31" text-anchor="start">去重</text>
<path d="M731 219 L812 219" fill="none" stroke="#37694f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="840" y="229" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="29" font-weight="600" fill="#253b31" text-anchor="start">聚类</text>
<text x="48" y="365" font-family="&#x27;SFMono-Regular&#x27;,&#x27;Menlo&#x27;,monospace" font-size="72" font-weight="600" fill="#37694f" text-anchor="start">404</text>
<text x="48" y="413" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="25" font-weight="400" fill="#6d776e" text-anchor="start">候选样本</text>
<text x="439" y="365" font-family="&#x27;SFMono-Regular&#x27;,&#x27;Menlo&#x27;,monospace" font-size="72" font-weight="600" fill="#37694f" text-anchor="start">323</text>
<text x="439" y="413" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="25" font-weight="400" fill="#6d776e" text-anchor="start">去重后纳入分发</text>
<text x="850" y="365" font-family="&#x27;SFMono-Regular&#x27;,&#x27;Menlo&#x27;,monospace" font-size="72" font-weight="600" fill="#37694f" text-anchor="start">16</text>
<text x="850" y="413" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="25" font-weight="400" fill="#6d776e" text-anchor="start">路由组</text>
<path d="M246 348 L389 348" fill="none" stroke="#a75c46" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315" y="313" font-family="&#x27;SFMono-Regular&#x27;,&#x27;Menlo&#x27;,monospace" font-size="29" font-weight="600" fill="#a75c46" text-anchor="middle">−81</text>
<path d="M646 348 L804 348" fill="none" stroke="#37694f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="724" y="313" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#37694f" text-anchor="middle">聚类</text>
<rect x="48" y="491" width="1024" height="64" fill="#edf2e9" stroke="none" stroke-width="1.5" rx="0"/>
<rect x="48" y="491" width="4" height="64" fill="#37694f" stroke="none" stroke-width="1.5" rx="0"/>
<text x="70" y="532" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="26" font-weight="500" fill="#37694f" text-anchor="start">先去重，再按原因组织；把重复修复挡在派单之前。</text>
</svg>
