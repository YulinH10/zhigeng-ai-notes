<text x="328" y="595.0" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#a75c46" text-anchor="start">失败 · 保留证据</text>
<text x="608" y="545" font-family="&#x27;SFMono-Regular&#x27;,&#x27;Menlo&#x27;,monospace" font-size="72" font-weight="600" fill="#977735" text-anchor="start">1</text>
<text x="608" y="595.0" font-family="&#x27;Hiragino Sans GB&#x27;,&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#977735" text-anchor="start">待定 · 等待判断</text>
